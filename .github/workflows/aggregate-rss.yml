name: Aggregate RSS Feeds

on:
  workflow_dispatch: # Allow manual trigger from Actions UI
  schedule:
    # Weekly feeds: Every Thursday at 1 AM UTC
    - cron: '0 1 * * thu'
    # Monthly feeds: First day of month at 1 AM UTC
    - cron: '0 1 1 * *'

permissions:
  contents: write # Allow pushing changes to repo

jobs:
  fetch-rss:
    name: Fetch RSS feeds and update README
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Fetch RSS feeds
        run: pnpm exec tsx packages/cli/src/cli.ts fetch
        continue-on-error: true # Continue even if fetch fails, so we can commit what we got

      - name: Generate aggregated data
        run: pnpm exec tsx packages/cli/src/cli.ts aggregate
        continue-on-error: true

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update RSS feeds and aggregated data'
          commit_options: '--no-verify'
          file_pattern: |
            data.json
            rss-entries.json
            README.md
